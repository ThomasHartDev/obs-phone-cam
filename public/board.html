<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Phone Cam — iPad board</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="board">
    <canvas id="board"></canvas>
    <div id="eraseCursor" hidden></div>
    <div class="board-hud">
      <div id="status" class="status">Starting board…</div>
      <div class="board-session">
        <button type="button" class="icon-btn" id="libBtn" aria-label="Drawings" title="Drawings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>
        </button>
        <div id="tabs" class="board-tabs" role="tablist"></div>
        <button type="button" class="icon-btn" id="tabNew" aria-label="New drawing" title="New drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6"/></svg>
        </button>
      </div>
      <div class="board-meta">
        <button type="button" class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H4v4"/><path d="M5 12a8 8 0 1 0 2-5.5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="redoBtn" aria-label="Redo" title="Redo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8h4v4"/><path d="M19 12a8 8 0 1 1-2-5.5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="clearBtn" aria-label="Clear" title="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M8 7l1 13h6l1-13"/></svg>
        </button>
        <button type="button" class="icon-btn" id="layerUpBtn" aria-label="Bring forward" title="Bring forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="12" height="10"/><rect x="4" y="10" width="12" height="10"/></svg>
        </button>
        <button type="button" class="icon-btn" id="layerDownBtn" aria-label="Send back" title="Send back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="12" height="10"/><rect x="7" y="10" width="12" height="10"/></svg>
        </button>
        <button type="button" class="icon-btn" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="zoomInBtn" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="zoomResetBtn" aria-label="Reset zoom" title="Reset zoom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M9 12h6"/></svg>
        </button>
        <select id="paper" aria-label="Paper">
          <option value="white">White</option>
          <option value="grid">Grid</option>
          <option value="green">Green (chroma)</option>
          <option value="dark">Dark</option>
        </select>
        <button type="button" class="icon-btn" id="logBtn" aria-pressed="false" aria-label="Logs" title="Logs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h8"/></svg>
        </button>
        <button type="button" class="icon-btn" id="shareBtn" hidden aria-pressed="false" aria-label="Share window" title="Share window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M11 7H6v12h12v-5"/></svg>
        </button>
      </div>
    </div>
    <div class="board-draw-dock" data-keep-alive data-open="true">
      <button type="button" class="icon-btn" data-tool="select" aria-pressed="false" aria-label="Move and rotate" title="Move and rotate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="pen" aria-pressed="true" aria-label="Pen" title="Pen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.5-1.2L19 8.3 15.7 5 5.3 15.4z"/><path d="M13.8 6.9l3.3 3.3"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="highlighter" aria-pressed="false" aria-label="Highlighter" title="Highlighter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15l7-7 3 3-7 7H7z"/><path d="M5 19h14"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="eraser" aria-pressed="false" aria-label="Eraser" title="Eraser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l7-7 8 8-4 4H8z"/><path d="M7 22h13"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="line" aria-pressed="false" aria-label="Line" title="Line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="rect" aria-pressed="false" aria-label="Rectangle" title="Rectangle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="1"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="ellipse" aria-pressed="false" aria-label="Oval" title="Oval">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="arrow" aria-pressed="false" aria-label="Arrow" title="Arrow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5"/><path d="M11 5h8v8"/></svg>
      </button>
      <button type="button" class="icon-btn" data-tool="text" aria-pressed="false" aria-label="Text" title="Text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v14"/><path d="M8 20h8"/></svg>
      </button>
      <span id="swatches" class="swatches"></span>
      <label class="width-label" id="widthLabel" title="Size">
        <span id="widthNoun" class="sr-only">Size</span>
        <input id="width" type="range" min="2" max="18" step="1" value="4" />
      </label>
      <select id="eraseMode" aria-label="Eraser mode" hidden>
        <option value="pixel">Pixel</option>
        <option value="element">Stroke</option>
      </select>
    </div>
    <form id="textPad" class="text-pad" hidden>
      <input id="textInput" type="text" enterkeyhint="done" autocomplete="off" aria-label="Text" />
    </form>
    <pre id="boardLog" class="board-log" hidden></pre>
    <div id="library" class="library" hidden>
      <div class="library-head">
        <strong>Drawings</strong>
        <button type="button" class="icon-btn" id="libNew" aria-label="New drawing" title="New">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="libClose" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul id="libList" class="library-list"></ul>
      <div class="library-head trash-head">
        <strong>Recently deleted</strong>
      </div>
      <ul id="trashList" class="library-list"></ul>
    </div>
    <script type="module" src="/board.js"></script>
  </body>
</html>
